<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles/style.css" />
    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body class="flex-center">
    <main class="product">
      <article class="product__container">
        <picture class="product__img-container">
          <source
            srcset="images/image-product-desktop.jpg"
            media="(width > 25.75rem)"
            width="600"
            height="900"
          />
          <img
            class="product__mobile-image"
            src="images/image-product-mobile.jpg"
            alt="Gabrielle Essence perfume bottle laying flat on a table"
            width="700"
            height="684"
          />
        </picture>
        <div class="product__content">
          <p class="product__category product__category--uppercase">Perfume</p>
          <h1 class="product__title">Gabrielle Essence Eau De Parfum</h1>
          <p class="product__description">
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>
          <div class="product__price-group">
            <p class="product__discounted-price">$149.99</p>
            <p class="product__original-price product__original-price--strike">
              $169.99
            </p>
          </div>
        </div>
        <button class="button">Add to Cart</button>
      </article>
    </main>
  </body>
</html>
